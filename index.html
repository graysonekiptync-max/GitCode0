<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitCode</title>
  <link rel="stylesheet" href="style.css">

  <!-- CodeMirror editor -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">⌘</div>
        <span>GitCode</span>
      </div>

      <div class="project-name">My Project <span class="muted">/</span> <span id="currentFile">index.html</span></div>

      <div class="top-actions">
        <button id="saveBtn" class="button">Save</button>
        <button id="runBtn" class="button primary">▶ Run</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="activity-bar">
        <button class="activity active" title="Explorer">▤</button>
        <button class="activity" title="Search" id="searchToggle">⌕</button>
        <button class="activity" title="Settings">⚙</button>
      </aside>

      <aside class="sidebar">
        <div class="sidebar-heading">EXPLORER <span>···</span></div>
        <div class="project-heading">
          <span>▾</span> MY PROJECT
          <div class="file-actions">
            <button id="newFileBtn" title="New file">＋</button>
            <button id="newFolderBtn" title="New folder">▣</button>
          </div>
        </div>
        <div id="fileTree" class="file-tree"></div>
      </aside>

      <main class="main-area">
        <div id="tabs" class="tabs"></div>

        <div class="editor-toolbar">
          <div class="breadcrumbs" id="breadcrumbs">index.html</div>
          <div class="editor-actions">
            <button id="previewBtn" class="button small">Preview</button>
            <button id="terminalBtn" class="button small">Terminal</button>
          </div>
        </div>

        <section class="editor-area">
          <div id="editorHost"></div>
        </section>

        <section id="bottomPanel" class="bottom-panel">
          <div class="panel-tabs">
            <button class="panel-tab active" data-panel="output">OUTPUT</button>
            <button class="panel-tab" data-panel="terminal">TERMINAL</button>
            <button class="panel-tab" data-panel="preview">PREVIEW</button>
            <button id="closePanel" class="close-panel">×</button>
          </div>
          <div id="output" class="panel-content"></div>
          <div id="terminal" class="panel-content hidden">
            <div class="terminal-line">GitCode browser terminal</div>
            <div class="terminal-line muted">Run JavaScript or Python using the Run button.</div>
          </div>
          <div id="preview" class="panel-content preview-content hidden">
            <iframe id="previewFrame" sandbox="allow-scripts"></iframe>
          </div>
        </section>
      </main>
    </div>

    <footer class="statusbar">
      <span>⌘ GitCode</span>
      <span id="statusMessage">Ready</span>
      <span id="languageLabel">HTML</span>
      <span>UTF-8</span>
      <span>Spaces: 2</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
